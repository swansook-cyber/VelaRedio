name: Android debug build check
on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || (echo 'Android SDK platform 35 unavailable' && exit 1)
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: vela-radio-debug-qa-only
          path: app/build/outputs/apk/debug/*.apk
