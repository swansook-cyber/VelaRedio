name: Vela Radio permanent-signed release
on:
  workflow_dispatch:
jobs:
  signed-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify signing credentials are configured
        env:
          KEYSTORE_BASE64: ${{ secrets.VELA_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.VELA_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.VELA_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VELA_RELEASE_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing permanent keystore secret"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing store password"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing key password"; exit 1; }
          test "$KEY_ALIAS" = "vela-store" || { echo "Unexpected signing alias"; exit 1; }
      - name: Decode permanent keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.VELA_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vela-release.jks"
          chmod 600 "$RUNNER_TEMP/vela-release.jks"
      - name: Build permanent-signed APK
        env:
          VELA_RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/vela-release.jks
          VELA_RELEASE_STORE_PASSWORD: ${{ secrets.VELA_RELEASE_STORE_PASSWORD }}
          VELA_RELEASE_KEY_ALIAS: ${{ secrets.VELA_RELEASE_KEY_ALIAS }}
          VELA_RELEASE_KEY_PASSWORD: ${{ secrets.VELA_RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vela-radio-v1.3.6-permanent-signed
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
