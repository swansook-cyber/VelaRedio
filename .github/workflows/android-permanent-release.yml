name: Vela Radio V2 signed release
on:
  workflow_dispatch:
jobs:
  signed-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify signing credentials are configured
        env:
          KEYSTORE_BASE64: ${{ secrets.VELA_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.VELA_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.VELA_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing permanent keystore secret"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing store password"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing key password"; exit 1; }
      - name: Decode permanent keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.VELA_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/velalab-release-v2.jks"
          chmod 600 "$RUNNER_TEMP/velalab-release-v2.jks"
      - name: Build permanent-signed APK
        env:
          VELA_RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/velalab-release-v2.jks
          VELA_RELEASE_STORE_PASSWORD: ${{ secrets.VELA_RELEASE_STORE_PASSWORD }}
          VELA_RELEASE_KEY_PASSWORD: ${{ secrets.VELA_RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          actual=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$actual" = "d40b918958e038a6b9eee0f2133939a97d99f9fb740c887a551f97b1f1c2e7f2" || { echo "V2 certificate mismatch"; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk | grep -F "package: name='net.velalab.radio' versionCode='21' versionName='1.3.7'"
          sha256sum app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vela-radio-v1.3.7-v2-signed
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
