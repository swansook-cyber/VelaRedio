name: Vela Radio release resource validation
on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: test -d "$ANDROID_HOME/platforms/android-35"
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate APK archive helper
        run: python3 scripts/archive_release.py --help > /dev/null
      - name: Compile release code and resources
        run: gradle --no-daemon :app:compileReleaseKotlin :app:processReleaseResources :app:assembleDebugAndroidTest
      - name: Verify release manifest metadata and branding references
        run: |
          manifest=app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
          grep -F 'android:versionCode="21"' "$manifest"
          grep -F 'android:versionName="1.3.7"' "$manifest"
          grep -F 'android:label="Vela Radio"' "$manifest"
          grep -F 'android:icon="@mipmap/ic_launcher"' "$manifest"
          grep -F 'android:banner="@drawable/vela_radio_tv_banner_640x360"' "$manifest"
          grep -F 'android.intent.category.LEANBACK_LAUNCHER' "$manifest"
